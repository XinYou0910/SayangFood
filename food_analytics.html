<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SayangFood - Food Analytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard_page.css">
  <link rel="stylesheet" href="food_analytics.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- Hamburger Button -->
  <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

  <!-- Sidebar (same as dashboard) -->
  <div class="sidebar">
    <div class="logo-container">
      <img src="pic/logo.png" alt="SayangFood Logo" class="logo-img">
      <div class="logo-text">
        <span class="brand">SayangFood</span><br>
        <small>Food Management System</small>
      </div>
    </div>

    <button class="menu-item" onclick="location.href='dashboard_page.html'">
      <img src="pic/home.png" alt="Home Icon" class="icon"> Dashboard
    </button>

    <button class="menu-item dropdown-btn" onclick="toggleDropdown()">
      <img src="pic/search.png" class="icon"> Browse Food Item
      <span class="arrow" id="arrowIcon">▼</span>
    </button>

<div id="dropdownMenu" class="dropdown-container">
  <button onclick="location.href='inventory_list.php'">Inventory</button>
  <button onclick="location.href='weekly_meal.php'">Weekly Meal</button>
  <button onclick="location.href='donation_list.php'">Donations</button>
</div>


    <button class="menu-item active">
      <img src="pic/data-analytics.png" alt="Analytics Icon" class="icon"> Food Analytics
    </button>

    <button class="menu-item">
      <img src="pic/notification.png" alt="Notification Icon" class="icon"> Notification
    </button>

    <div class="profile">
      <img src="pic/user.png" alt="User" class="profile-img">
      <div class="profile-info">
        <p class="username" id="username">User</p>
        <p class="role">User Profile</p>
        <button onclick="logout()" class="logout-btn">Logout</button>
      </div>
    </div>
  </div>

  <!-- Main Analytics Content -->
  <div class="main-content">
    <div class="header">
      <h1>Food Analytics</h1>
      <p>Advanced analytics and predictive insights for waste management.</p>
    </div>

    <div class="filter-controls">
      <select id="filterRange">
        <option value="7">7 days</option>
        <option value="30" selected>1 month</option>
        <option value="365">12 months</option>
      </select>
      <button id="filterBtn" class="filter-btn">Filter</button>
    </div>

    <!-- Summary Cards -->
    <div class="dashboard-cards">
      <div class="card">
        <h2>Total Food Saving</h2>
        <p id="total-saving">-- KG</p>
      </div>
      <div class="card">
        <h2>Total Food Waste</h2>
        <p id="total-waste">-- KG</p>
      </div>
      <div class="card">
        <h2>Total Donation Made</h2>
        <p id="total-donation">--</p>
      </div>
      <div class="card">
        <h2>Total Food Usage</h2>
        <p id="total-usage">-- KG</p>
      </div>
    </div>

    <!-- Chart Controls -->
    <div class="chart-toggle">
      <button id="trendBtn" class="active">View Trend</button>
      <button id="categoryBtn">By Category</button>
    </div>

 <!-- Chart Section -->
<div class="charts" id="trendSection">
  <div class="chart-card">
    <h3 id="chartTitle">Food Trend</h3>
    <canvas id="foodChart"></canvas>
  </div>
</div>

<!-- Category Chart Section (hidden by default) -->
<div class="food-analytics-container" id="categorySection" style="display: none;">
  <!-- Donut Chart Box -->
  <div class="chart-box">
    <h3 class="chart-title">Food Category Distribution</h3>
    <canvas id="categoryChart"></canvas>
  </div>

  <!-- Legend Box -->
  <div class="legend-box">
    <h3 class="legend-title">Category Breakdown</h3>
    <div id="foodLegend"></div>
  </div>
</div>




  <!-- Global site scripts (sets username, sidebar behavior) -->
  <script src="script.js"></script>
  <!-- Analytics-specific JS -->
  <script src="food_analytics.js"></script>
</body>
</html>
