<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Verification</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .verify-box {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
      width: 350px;
    }
    .verify-box h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .verify-box label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .verify-box input {
      width: 90%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .verify-box button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #28a745;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .verify-box button:hover {
      background: #218838;
    }
  </style>
</head>
<body>

  <div class="verify-box">
    <h2>Verify Your Account</h2>
    <form method="POST" action="verify.php">
      <label for="email">Email</label>
      <input type="email" name="email" id="email" placeholder="Enter your email" required>

      <label for="code">Verification Code</label>
      <input type="text" name="code" id="code" maxlength="6" placeholder="Enter 6-digit code" required>

      <button type="submit">Verify</button>
    </form>
  </div>

</body>
</html>
