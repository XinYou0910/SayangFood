<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verification - SayangFood</title>
  <link rel="stylesheet" href="verify_page.css">
  <style>
    .form-group span {
      color: red;
    }

    /* Resend button style */
    .resend-btn {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 2px solid #0a0a0a;
      color: #141414;
      font-size: 15px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .resend-btn:hover {
      background: #a1a3a1;
      color: white;
    }

    .message {
      margin-top: 10px;
      color: #333;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="verify-container">
    <div class="verify-box">
      <h2>Email Verification</h2>
      <p>Please enter the 6-digit verification code sent to your email and set your password again to activate 2FA.</p>

      <form action="verify.php" method="POST">
        <!-- Hidden email field (auto-filled using JS) -->
        <input type="hidden" name="email" id="emailField">

        <div class="form-group">
          <label>Verification Code <span>*</span></label>
          <input type="text" name="verification_code" maxlength="6" required>
        </div>

        <div class="form-group">
          <label>New Password <span>*</span></label>
          <input type="password" name="new_password" required>
        </div>

        <button type="submit" class="verify-btn">Verify Account</button>
      </form>

      <!-- ✅ Resend Code Button -->
      <form action="resend_code.php" method="POST" id="resendForm">
        <input type="hidden" name="email" id="resendEmail">
        <button type="submit" class="resend-btn">Resend Code</button>
      </form>

      <p id="resendMessage" class="message"></p>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email');
    if (email) {
      document.getElementById('emailField').value = email;
      document.getElementById('resendEmail').value = email;
    } else {
      console.warn("⚠️ No email found in URL.");
    }
  </script>
</body>
</html>
