<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verification - SayangFood</title>
  <link rel="stylesheet" href="verify_page.css">
  <style>
    /* Add this if not already in your CSS */
    .form-group span {
      color: red;
    }
  </style>
</head>
<body>
  <div class="verify-container">
    <div class="verify-box">
      <h2>Email Verification</h2>
      <p>Please enter the 6-digit verification code sent to your email and set your password again to activate 2FA.</p>

      <form action="verify.php" method="POST">
        <!-- Hidden email field (auto-filled using JS) -->
        <input type="hidden" name="email" id="emailField">

        <div class="form-group">
          <label>Verification Code <span>*</span></label>
          <input type="text" name="verification_code" maxlength="6" required>
        </div>

        <div class="form-group">
          <label>New Password <span>*</span></label>
          <input type="password" name="new_password" required>
        </div>

        <button type="submit" class="verify-btn">Verify Account</button>
      </form>
    </div>
  </div>

  <!-- JavaScript to auto-fill email -->
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email');
    if (email) {
      document.getElementById('emailField').value = email;
    } else {
      console.warn("⚠️ No email found in URL.");
    }
  </script>
</body>
</html>
