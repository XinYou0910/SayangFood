<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SayangFood - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard_page.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- Hamburger Button -->
  <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo-container">
      <img src="pic/logo.png" alt="SayangFood Logo" class="logo-img">
      <div class="logo-text">
        <span class="brand">SayangFood</span><br>
        <small>Food Management System</small>
      </div>
    </div>

    <button class="menu-item active" onclick="location.href='dashboard_page.html'">
      <img src="pic/home.png" alt="Home Icon" class="icon"> Dashboard
    </button>

    <button class="menu-item dropdown-btn" onclick="toggleDropdown()">
      <img src="pic/search.png" class="icon"> Browse Food Item
      <span class="arrow" id="arrowIcon">▼</span>
    </button>

    <div class="dropdown-container">
      <button onclick="location.href='inventory_list.php'">Inventory</button>
      <button onclick="location.href='meal_plan.php'">Meal Plan</button>
      <button onclick="location.href='donation_list.php'">Donations</button>
    </div>

    <button class="menu-item" onclick="location.href='food_analytics.html'">
      <img src="pic/data-analytics.png" alt="Analytics Icon" class="icon"> Food Analytics
    </button>

    <button class="menu-item" onclick="location.href='notification1.php'">
      <img src="pic/notification.png" alt="Notification Icon" class="icon"> Notification
    </button>

    <div class="profile">
      <img src="pic/user.png" alt="User" class="profile-img">
      <div class="profile-info">
        <p class="username" id="username">User</p>
        <p class="role">User Profile</p>
        <button onclick="logout()" class="logout-btn">Logout</button>
      </div>
    </div>
  </div>

  <!-- Main Dashboard Content -->
  <div class="main-content">
    <div class="header">
      <h1>Dashboard Overview</h1>
      <p>Quick insights of your food inventory and donations.</p>
    </div>

    <!-- Dashboard Cards -->
    <div class="dashboard-cards">
      <div class="card">
        <h2>Total Food Items</h2>
        <p id="totalFoodItems">0</p>
      </div>
      <div class="card">
        <h2>Expiring Soon</h2>
        <p id="expiringSoon">0</p>
      </div>
      <div class="card">
        <h2>Donations Made</h2>
        <p id="donationsMade">0</p>
      </div>
    </div>

    <!-- Chart Section -->
    <div class="charts">
      <div class="chart-card">
        <h3>Food Category Distribution</h3>
        <canvas id="foodCategoryChart"></canvas>
      </div>

      <div class="chart-card">
        <h3>Monthly Donations</h3>
        <canvas id="donationTrendChart"></canvas>
      </div>

      <div class="chart-card">
        <h3>Expiry Status</h3>
        <canvas id="expiryStatusChart"></canvas>
      </div>
    </div>
  </div>
  </div>

  <!-- User Script -->
  <script>
    const username = localStorage.getItem('user_name');
    if (username) {
      document.getElementById('username').textContent = username;
    } else {
      window.location.href = 'login.html';
    }

    function logout() {
      localStorage.removeItem('user_name');
      window.location.href = 'Homepage.html';
    }

    function toggleSidebar() {
      document.querySelector('.sidebar').classList.toggle('active');
    }
  </script>

  <!-- Dashboard JS -->
  <script src="dashboard_page.js"></script>
</body>
</html>
