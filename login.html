<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - SayangFood</title>
  <link rel="stylesheet" href="login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background"></div>

  <div class="container">
    <div class="login-box">
      <!-- Left Login Form -->
      <div class="form-section">
        <h1>Login</h1>
        <p class="subtitle">Welcome back! Please sign in to your account</p>

        <form action="login.php" method="POST">
          <div class="form-group">
            <label>Email <span>*</span></label>
            <input type="email" name="email" placeholder="example@email.com" required />
          </div>

          <div class="form-group">
            <label>Password <span>*</span></label>
            <input type="password" name="password" placeholder="••••••••" required />
          </div>

          <div class="options">
            <label><input type="checkbox" name="remember"> Remember Me</label>
            <a href="forgot_password.html" class="forgot">Forgot Password?</a>
          </div>

          <button type="submit" class="login-btn">Log In</button>
        </form>
      </div>

      <!-- Right Side -->
      <div class="side-section">
        <img src="pic/Logo.png" alt="SayangFood Logo" class="logo" />
        <div class="text-content">
          <h2>Welcome to SayangFood</h2>
          <p>Your Smart Food Waste Management System</p>
        </div>
        <div class="signup-section">
          <p>Don’t have an account?</p>
          <a href="register_page.html" class="signup-btn">Sign Up</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
