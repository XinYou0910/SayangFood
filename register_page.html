<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SayangFood</title>
  <link rel="stylesheet" href="register_page.css">
</head>
<body>
  <div class="container">
    <div class="register-box">
      <!-- Left Form Section -->
      <div class="form-section">
        <img src="pic/Logo.png" alt="SayangFood Logo" class="logo">

        <h1>Sign Up</h1>
        <p class="subtitle">Let’s create your account</p>

        <form action="register.php" method="POST">
          <div class="form-group">
            <label>Email <span>*</span></label>
            <input type="email" name="email" required>
          </div>

          <div class="form-group">
            <label>Full Name <span>*</span></label>
            <input type="text" name="user_name" required>
          </div>

          <div class="form-group">
            <label>Password <span>*</span></label>
            <input type="password" name="password" required>
          </div>

          <div class="form-group">
            <label>Household Size (Optional)</label>
            <input type="number" name="household_size" min="1" placeholder="e.g., 4">
          </div>

          <button type="submit" class="signup-btn">Sign Up</button>
        </form>
      </div>

      <!-- Right Side Section -->
      <div class="side-section">
        <h2>SayangFood</h2>
        <p>Your Smart Food Waste Management System</p>

        <div class="login-section">
          <a href="login.html" class="login-btn">Login</a>
          <p class="already">Already have an account?</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
