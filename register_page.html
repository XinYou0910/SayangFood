<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SayangFood</title>
  <link rel="stylesheet" href="register_page.css">
</head>
<body>
  <div class="container">
    <div class="register-box">
      <div class="form-section">
        <img src="pic/Logo.png" alt="SayangFood Logo" class="logo">

        <h1>Sign Up</h1>
        <p class="subtitle">Let’s create an account</p>

        <form action="register.php" method="POST">
          <div class="form-row">
            <div class="form-group">
              <label>Email <span>*</span></label>
              <input type="email" name="email" required>
            </div>
            <div class="form-group">
              <label>Name <span>*</span></label>
              <input type="text" name="user_name" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Password <span>*</span></label>
              <input type="password" name="password" required>
            </div>
            <div class="form-group">
              <label>Gender <span>*</span></label>
              <input type="text" name="gender" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Phone Number <span>*</span></label>
              <input type="text" name="phone_num" required>
            </div>
            <div class="form-group">
              <label>Age <span>*</span></label>
              <input type="number" name="age" required>
            </div>
          </div>

          <div class="form-group full-width">
            <label>Address <span>*</span></label>
            <input type="text" name="address" required>
          </div>

          <button type="submit" class="signup-btn">Sign Up</button>
        </form>
      </div>

      <div class="side-section">
        <h2>SayangFood</h2>
        <p>Your Smart Food Waste Management System</p>
        <a href="login.html" class="login-btn">Login</a>
      </div>
    </div>
  </div>
</body>
</html>
