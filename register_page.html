<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - SayangFood</title>
  <link rel="stylesheet" href="register_page.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background"></div>

  <div class="container">
    <div class="register-box">
      <!-- Left Form Section -->
      <div class="form-section">
        <h1>Sign Up</h1>
        <p class="subtitle">Create your SayangFood account</p>

        <form action="register.php" method="POST">
          <div class="form-group">
            <label>Email <span>*</span></label>
            <input type="email" name="email" placeholder="example@email.com" required />
          </div>

          <div class="form-group">
            <label>Full Name <span>*</span></label>
            <input type="text" name="user_name" placeholder="Your full name" required />
          </div>

          <div class="form-group">
            <label>Password <span>*</span></label>
            <input type="password" name="password" placeholder="Must be 8 charecters" required />
          </div>

          <div class="form-group">
            <label>Household Size (Optional)</label>
            <input type="number" name="household_size" min="1" placeholder="e.g., 4" />
          </div>

          <button type="submit" class="signup-btn">Create Account</button>
        </form>
      </div>

      <!-- Right Side Section -->
      <div class="side-section">
        <!-- ✅ Logo moved here -->
        <img src="pic/Logo.png" alt="SayangFood Logo" class="logo" />

        <div class="text-content">
          <h2>Welcome to SayangFood</h2>
          <p>Your Smart Food Waste Management System</p>
        </div>

        <div class="login-section">
          <p>Already have an account?</p>
          <a href="login.html" class="login-btn">Login</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Smooth transition for Login -->
  <script>
    const loginBtn = document.querySelector(".login-btn");
    if (loginBtn) {
      loginBtn.addEventListener("click", function (event) {
        event.preventDefault();
        document.body.classList.add("fade-out");
        setTimeout(() => {
          window.location.href = this.href;
        }, 500);
      });
    }
  </script>
</body>
</html>
